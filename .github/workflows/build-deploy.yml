name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/pokedex.client/package-lock.json

      - name: Run the C# tests
        run: dotnet test

      - name: Install the npm packages
        working-directory: src/pokedex.client
        run: npm ci

      - name: Run the React tests
        working-directory: src/pokedex.client
        run: npm test

      - name: Publish the app
        run: dotnet publish src/Pokedex.Server -c Release -o publish

      - name: Upload the published app
        uses: actions/upload-artifact@v7
        with:
          name: pokedex-app
          path: publish
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the published app
        uses: actions/download-artifact@v8
        with:
          name: pokedex-app
          path: publish

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: aspnet-kanto-pokedex-frankg2694
          package: publish
